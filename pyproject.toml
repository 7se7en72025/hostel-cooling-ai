[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hostel-cooling-ai"
version = "2.0.0"
description = "Complete simulated hostel cooling study with local LLM preference learning for CE F417 and CE F423"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "reportlab>=4,<6"]

[project.scripts]
hostel-cooling = "hostel_cooling.cli:main"

[tool.setuptools.package-data]
hostel_cooling = ["web/*", "resources/*"]

[tool.setuptools.packages.find]
include = ["hostel_cooling*"]
